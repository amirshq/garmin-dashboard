[project]
name = "garmin-dashboard"
version = "0.1.0"
description = "Personal Garmin health dashboard + MCP server over the Garmin Connect Personal API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fitdecode>=0.10",
    "streamlit>=1.38",
    "plotly>=5.22",
    "pandas>=2.2",
    "mcp[cli]>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garmin", "db", "mcp_server", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
